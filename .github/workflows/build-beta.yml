name: Beta Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build beta APK
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Seraph.App/package-lock.json

      - name: Install JS dependencies
        working-directory: Seraph.App
        run: npm ci

      - name: Restore debug keystore
        working-directory: Seraph.App/android/app
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Compute version name
        id: version
        run: |
          BASE=$(grep versionName Seraph.App/android/app/build.gradle | grep -oP '"\K[^"]+')
          TS=$(date +%s%3N)
          echo "version=${BASE}-beta.${TS}" >> $GITHUB_OUTPUT

      - name: Set version in build.gradle
        run: |
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.version }}"/' \
            Seraph.App/android/app/build.gradle

      - name: Set version in app.json
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.version }}"/' \
            Seraph.App/app.json

      - name: Build release APK
        working-directory: Seraph.App/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Rename APK
        run: |
          mv Seraph.App/android/app/build/outputs/apk/release/app-release.apk \
             Seraph.App/android/app/build/outputs/apk/release/seraph-${{ steps.version.outputs.version }}.apk

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seraph-${{ steps.version.outputs.version }}
          path: Seraph.App/android/app/build/outputs/apk/release/seraph-${{ steps.version.outputs.version }}.apk
          retention-days: 60

  distribute:
    name: Distribute to Firebase
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: seraph-${{ needs.build.outputs.version }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: seraph-${{ needs.build.outputs.version }}.apk
