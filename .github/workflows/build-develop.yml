name: Develop Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build develop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Seraph.App/package-lock.json

      - name: Install JS dependencies
        working-directory: Seraph.App
        run: npm ci

      - name: Restore debug keystore
        working-directory: Seraph.App/android/app
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Compute version name
        id: version
        run: |
          BASE=$(grep versionName Seraph.App/android/app/build.gradle | grep -oP '"\K[^"]+')
          SHA=$(git rev-parse --short HEAD)
          echo "version=${BASE}-dev+${SHA}" >> $GITHUB_OUTPUT

      - name: Set version in build.gradle
        run: |
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.version }}"/' \
            Seraph.App/android/app/build.gradle

      - name: Set version in app.json
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.version }}"/' \
            Seraph.App/app.json

      - name: Build staging APK
        working-directory: Seraph.App/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
        run: ./gradlew assembleStaging --no-daemon --build-cache

      - name: Rename APK
        run: |
          mv Seraph.App/android/app/build/outputs/apk/staging/app-staging.apk \
             Seraph.App/android/app/build/outputs/apk/staging/seraph-${{ steps.version.outputs.version }}.apk

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seraph-${{ steps.version.outputs.version }}
          path: Seraph.App/android/app/build/outputs/apk/staging/seraph-${{ steps.version.outputs.version }}.apk
          retention-days: 30
